<!doctype html><html lang='pt-BR'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'><title>VIGIL: Ruína</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#071014;color:#edf4f4;font-family:system-ui;touch-action:none}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;inset:0;padding:13px;pointer-events:none}.bar{width:min(290px,62vw);height:12px;border:1px solid #657478;background:#0b161b;border-radius:3px;margin:5px}.fill{height:100%;background:#e4554e}.xp{background:#54b8d8}.time{position:absolute;right:14px;top:14px;text-align:right}.time b{display:block;color:#efc55d;font-size:20px}.level{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-size:12px;letter-spacing:1px}.weapon{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:12px;border:1px solid #64726f;border-radius:14px;padding:7px 12px;background:#0d171acc;color:#f0c561;white-space:nowrap}.panel{position:fixed;inset:0;z-index:3;display:grid;place-items:center;padding:18px;background:#05080ac7}.box{width:min(430px,100%);text-align:center;background:linear-gradient(145deg,#233137,#0c1418);border:1px solid #c5964d;border-radius:18px;padding:28px 20px;box-shadow:0 20px 60px #000}.logo{font-size:54px;font-weight:950;line-height:.8;letter-spacing:-3px}.logo small{display:block;color:#efc869;font-size:14px;letter-spacing:5px;margin:16px}.box p{font-size:14px;line-height:1.45;color:#becacd}.btn,.card{border:0;font-weight:900;cursor:pointer}.btn{padding:14px 23px;background:#e6b756;color:#211706;border-radius:10px;box-shadow:0 4px #855d26;font-size:16px}.hide{display:none!important}.upgrade{position:fixed;z-index:4;inset:0;padding:15px;display:grid;place-items:center;background:#04080adf;text-align:center}.upgrade h2{color:#f2c86a;margin:0}.cards{display:flex;gap:10px;width:min(680px,100%);margin-top:16px}.card{flex:1;padding:14px;min-height:145px;text-align:left;color:#fff;border-radius:13px;border:1px solid #5b686d;background:linear-gradient(145deg,#2a3940,#111a1e)}.card i{font-size:27px;font-style:normal}.card h3{font-size:14px;color:#f2c769;margin:8px 0 4px}.card p{font-size:12px;color:#bcc7ca;margin:0}.joy{display:none;position:fixed;z-index:2;left:20px;bottom:20px;width:112px;height:112px;border-radius:50%;background:#1b2b2e66;border:1px solid #fff3}.knob{width:46px;height:46px;margin:32px;border-radius:50%;background:#d9e7e966}@media(pointer:coarse){.joy{display:block}}@media(max-width:520px){.cards{flex-direction:column}.card{min-height:0;display:grid;grid-template-columns:40px 1fr}.card i{grid-row:span 2}.card h3{margin:2px}.card p{margin:2px}}</style><canvas id='game'></canvas><div id='hud' class='hide'><div class='level'>NÍVEL <span id='lv'>1</span></div><div class='bar'><div id='hp' class='fill'></div></div><div class='bar'><div id='xp' class='fill xp'></div></div><div class='time'><b id='clock'>00:00</b><span id='kills'>0 abatidos</span></div><div id='weapon' class='weapon'>LÂMINAS DE RELÉ</div></div><div id='menu' class='panel'><div class='box'><div class='logo'>VIGIL<small>RUÍNA · SURVIVOR</small></div><p>Sobreviva à arena, elimine o enxame e escolha melhorias a cada nível.</p><button id='play' class='btn'>ENTRAR NA RUÍNA</button><p>WASD ou setas. No celular, arraste o analógico. O ataque é automático.</p></div></div><div id='pick' class='upgrade hide'><div><h2>ESCOLHA UMA MODIFICAÇÃO</h2><p>O núcleo respondeu ao seu avanço</p><div id='cards' class='cards'></div></div></div><div id='dead' class='panel hide'><div class='box'><div class='logo'>SINAL<small>PERDIDO</small></div><h2 id='final'></h2><p id='report'></p><button id='retry' class='btn'>TENTAR DE NOVO</button></div></div><div id='joy' class='joy'><div id='knob' class='knob'></div></div><script>(()=>{const c=document.querySelector('#game'),g=c.getContext('2d'),$=s=>document.querySelector(s);let W,H,D,keys={},stick={x:0,y:0},run=false,p,enemies=[],shots=[],gems=[],last=0;function resize(){D=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const upgrades=[['⚔️','LÂMINA DUPLA','Dispara uma lâmina extra.',()=>p.count++],['⚡','SOBRECARGA','Ataques 25% mais rápidos.',()=>p.cool*=.75],['☄️','NÚCLEO QUENTE','+10 de dano.',()=>p.damage+=10],['🛡️','PLACA DE AÇO','Recupera 25 de vida.',()=>p.hp=Math.min(p.max,p.hp+25)],['👢','PROPULSÃO','+20% de velocidade.',()=>p.speed*=1.2],['🧲','COLETOR','Ímãs de energia maiores.',()=>p.magnet+=55]];function begin(){p={x:W/2,y:H/2,hp:100,max:100,lvl:1,xp:0,need:8,time:0,kills:0,speed:235,damage:26,cool:.45,count:1,magnet:100,fire:0,hurt:0};enemies=[];shots=[];gems=[];run=true;$('#menu').classList.add('hide');$('#dead').classList.add('hide');$('#hud').classList.remove('hide');last=performance.now();requestAnimationFrame(loop)}function enemy(){let side=Math.random()*4|0,pad=30,x,y;if(side===0){x=Math.random()*W;y=-pad}else if(side===1){x=W+pad;y=Math.random()*H}else if(side===2){x=Math.random()*W;y=H+pad}else{x=-pad;y=Math.random()*H}let elite=Math.random()<Math.min(.12,p.time/400);enemies.push({x,y,r:elite?22:14,hp:elite?110+p.time:40+p.time*.5,spd:elite?57:78+p.time*.25,dmg:elite?15:7,elite,col:elite?'#bf7c39':'#708995'})}function shoot(){if(!enemies.length)return;let target=enemies.reduce((best,e)=>Math.hypot(e.x-p.x,e.y-p.y)<Math.hypot(best.x-p.x,best.y-p.y)?e:best,enemies[0]);let angle=Math.atan2(target.y-p.y,target.x-p.x);for(let n=0;n<p.count;n++){let a=angle+(n-(p.count-1)/2)*.24;shots.push({x:p.x,y:p.y,vx:Math.cos(a)*630,vy:Math.sin(a)*630,life:1})}p.fire=p.time}function die(i){let e=enemies[i];enemies.splice(i,1);p.kills++;for(let n=0;n<(e.elite?5:1);n++)gems.push({x:e.x+(Math.random()-.5)*18,y:e.y+(Math.random()-.5)*18,val:e.elite?3:1})}function choose(){run=false;$('#pick').classList.remove('hide');let list=$('#cards');list.innerHTML='';upgrades.slice().sort(()=>Math.random()-.5).slice(0,3).forEach(u=>{let b=document.createElement('button');b.className='card';b.innerHTML='<i>'+u[0]+'</i><div><h3>'+u[1]+'</h3><p>'+u[2]+'</p></div>';b.onclick=()=>{u[3]();p.lvl++;p.xp-=p.need;p.need=Math.floor(p.need*1.45+3);$('#pick').classList.add('hide');run=true;last=performance.now();requestAnimationFrame(loop)};list.appendChild(b)})}function update(dt){p.time+=dt;p.hurt-=dt;let dx=(keys.a||keys.ArrowLeft?-1:0)+(keys.d||keys.ArrowRight?1:0)+stick.x,dy=(keys.w||keys.ArrowUp?-1:0)+(keys.s||keys.ArrowDown?1:0)+stick.y,len=Math.hypot(dx,dy)||1;p.x=Math.max(18,Math.min(W-18,p.x+dx/len*p.speed*dt));p.y=Math.max(18,Math.min(H-18,p.y+dy/len*p.speed*dt));let rate=1.5+Math.min(2,p.time/65);if(Math.random()<dt*rate)enemy();if(p.time-p.fire>p.cool)shoot();for(let e of enemies){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;if(d<e.r+15&&p.hurt<0){p.hp-=e.dmg;p.hurt=.45}}for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if((e.x-s.x)**2+(e.y-s.y)**2<(e.r+7)**2){e.hp-=p.damage;s.life=0;if(e.hp<=0)die(j);break}}if(s.life<=0)shots.splice(i,1)}for(let i=gems.length-1;i>=0;i--){let z=gems[i],dx=p.x-z.x,dy=p.y-z.y,d=Math.hypot(dx,dy)||1;if(d<p.magnet){z.x+=dx/d*(160+(p.magnet-d)*4)*dt;z.y+=dy/d*(160+(p.magnet-d)*4)*dt}if(d<22){p.xp+=z.val;gems.splice(i,1);if(p.xp>=p.need){choose();break}}}if(p.hp<=0)gameover();hud()}function hud(){$('#hp').style.width=Math.max(0,p.hp/p.max*100)+'%';$('#xp').style.width=p.xp/p.need*100+'%';$('#lv').textContent=p.lvl;$('#kills').textContent=p.kills+' abatidos';let m=p.time/60|0,s=p.time%60|0;$('#clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('#weapon').textContent=p.count>1?'LÂMINAS DE RELÉ × '+p.count:'LÂMINAS DE RELÉ'}function draw(){g.fillStyle='#081014';g.fillRect(0,0,W,H);g.strokeStyle='#62808a20';g.lineWidth=1;for(let x=0;x<W;x+=54){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=54){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}for(let z of gems){g.fillStyle=z.val>1?'#f0c257':'#51b9df';g.beginPath();g.moveTo(z.x,z.y-6);g.lineTo(z.x+6,z.y);g.lineTo(z.x,z.y+6);g.lineTo(z.x-6,z.y);g.fill()}for(let e of enemies){g.fillStyle=e.col;g.beginPath();g.arc(e.x,e.y,e.r,0,Math.PI*2);g.fill();g.fillStyle=e.elite?'#f5cc68':'#243740';g.beginPath();g.arc(e.x-4,e.y-2,2.5,0,7);g.arc(e.x+4,e.y-2,2.5,0,7);g.fill()}for(let s of shots){g.fillStyle='#f5d272';g.beginPath();g.arc(s.x,s.y,5,0,7);g.fill()}if(!(p.hurt>0&&Math.floor(p.time*14)%2)){g.fillStyle='#dce8e9';g.beginPath();g.arc(p.x,p.y,15,0,7);g.fill();g.fillStyle='#385866';g.fillRect(p.x-8,p.y-3,16,13);g.strokeStyle='#f1c767';g.lineWidth=3;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+15,p.y-15);g.stroke()}}function loop(t){if(!run)return;let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();if(run)requestAnimationFrame(loop)}function gameover(){run=false;$('#hud').classList.add('hide');$('#final').textContent=$('#clock').textContent;$('#report').textContent='Você derrotou '+p.kills+' criaturas e alcançou o nível '+p.lvl+'.';$('#dead').classList.remove('hide')}addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);let joy=$('#joy'),knob=$('#knob');function move(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y),limit=33;if(d>limit){x*=limit/d;y*=limit/d}stick={x:x/limit,y:y/limit};knob.style.transform='translate('+x+'px,'+y+'px)'}joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);move(e)};joy.onpointermove=e=>e.buttons&&move(e);joy.onpointerup=joy.onpointercancel=()=>{stick={x:0,y:0};knob.style.transform=''};$('#play').onclick=begin;$('#retry').onclick=begin;draw()})()</script></html>
